<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#14532d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Green organic leaf body -->
  <path
    d="M 12 52 
       C 10 38, 14 20, 32 10 
       C 48 2, 54 4, 56 6 
       C 58 8, 60 14, 52 30 
       C 42 48, 24 52, 12 52 Z"
    fill="url(#leafGrad)"
    filter="url(#shadow)"
  />

  <!-- Main leaf vein -->
  <path
    d="M 12 52 
       C 24 40, 36 28, 54 8"
    fill="none"
    stroke="url(#veinGrad)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Side leaf veins -->
  <path
    d="M 23 43 C 28 38, 32 37, 36 38"
    fill="none"
    stroke="#166534"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.8"
  />
  <path
    d="M 31 35 C 38 31, 42 30, 46 32"
    fill="none"
    stroke="#166534"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.8"
  />
  <path
    d="M 40 26 C 45 22, 49 21, 52 23"
    fill="none"
    stroke="#166534"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.8"
  />
  <path
    d="M 28 38 C 24 33, 22 28, 22 24"
    fill="none"
    stroke="#166534"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.8"
  />
  <path
    d="M 37 29 C 33 24, 31 19, 32 16"
    fill="none"
    stroke="#166534"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Subtle glossy leaf highlight -->
  <path
    d="M 20 40 
       C 20 28, 26 18, 38 12 
       C 32 16, 26 26, 24 38 Z"
    fill="#ffffff"
    opacity="0.25"
  />
</svg>
